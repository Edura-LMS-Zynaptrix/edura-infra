# The 11 backend microservices. Generated layout: one Deployment + one
# ClusterIP Service per service. Secrets come from the <name>-service-env
# Secret, created by scripts/deploy-env.sh (from GitHub environment secrets in CI).
# __ACR__ and __TAG__ (the edura-backend git SHA) are replaced at deploy time.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # Kubernetes would otherwise inject REDIS_PORT=tcp://..., RABBITMQ_PORT=tcp://...
      # for every Service, overriding the plain port numbers the services expect.
      enableServiceLinks: false
      containers:
        - name: auth-service
          image: __ACR__/edura-auth-service:__TAG__
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: auth-service-env
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
