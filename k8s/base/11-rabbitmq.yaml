# RabbitMQ runs as a StatefulSet so its node name (rabbit@rabbitmq-0) and its
# disk survive restarts — durable queues keep undelivered events.
# Only reachable inside the cluster (ClusterIP), never from the internet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # Kubernetes would otherwise inject REDIS_PORT=tcp://..., RABBITMQ_PORT=tcp://...
      # for every Service, overriding the plain port numbers the services expect.
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
          # The user is created from this secret when the data disk is first initialised.
          # On an existing disk, scripts/deploy-env.sh creates or updates it with rabbitmqctl.
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          ports:
            - containerPort: 5672
            - containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
# Creates the exchange / queues / bindings (edura-infra/rabbitmq/setup.py).
# Idempotent; re-run it after a topology change with:
#   re-run scripts/deploy-env.sh (it recreates this Job on every deploy)
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-setup
spec:
  backoffLimit: 10
  template:
    spec:
      # Kubernetes would otherwise inject REDIS_PORT=tcp://..., RABBITMQ_PORT=tcp://...
      # for every Service, overriding the plain port numbers the services expect.
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: rabbitmq-setup
          image: __ACR__/edura-rabbitmq-setup:__SETUP_TAG__
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
