events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_status 429;

    # Upstream blocks for all 11 microservices
    upstream auth_service {
        server auth_service:8001;
    }

    upstream user_service {
        server user_service:8002;
    }

    upstream course_service {
        server course_service:8003;
    }

    upstream content_service {
        server content_service:8004;
    }

    upstream enrollment_service {
        server enrollment_service:8005;
    }

    upstream payment_service {
        server payment_service:8006;
    }

    upstream assessment_service {
        server assessment_service:8007;
    }

    upstream progress_service {
        server progress_service:8008;
    }

    upstream notification_service {
        server notification_service:8009;
    }

    upstream analytics_service {
        server analytics_service:8010;
    }

    upstream admin_service {
        server admin_service:8011;
    }

    server {
        listen 80;
        server_name localhost;

        # Apply rate limiting
        limit_req zone=api burst=20 nodelay;

        # CORS Headers
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            return 404;
        }


        # Auth Service Routing
        location /api/auth/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Service Routing
        location /api/users/ {
            if ($request_method = 'OPTIONS') {
