# Lint/format settings for the Python in this repo (rabbitmq/, nginx/tests/).
# Kept identical to edura-backend/pyproject.toml, see
# documents/standards/coding-standards.md.

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = ["B008", "E501", "B904", "E402"]

[tool.black]
line-length = 88
target-version = ['py312']
