name: EDURA CI — 2-Week Build

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

on:
  push:
    branches: [ develop, main, 'feature/**', 'fix/**' ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ develop, main ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: danindu2024/edura-backend-2
          path: edura-backend-2
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          repository: danindu2024/edura-frontend-2
          path: edura-frontend-2
          token: ${{ secrets.GH_PAT || github.token }}

      # Backend Linting
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check edura-backend-2/

      - name: Run Black Formatter Check
        run: |
          pip install black
          black --check edura-backend-2/

      # Frontend Linting
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Frontend Lint
        run: |
          if [ -f "edura-frontend-2/package.json" ]; then
            cd edura-frontend-2
            npm ci || npm install
            npm run lint || echo "Frontend lint exited with warnings/config conflicts"
          else
            echo "No package.json in edura-frontend-2 yet; skipping npm lint"
          fi


  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: danindu2024/edura-backend-2
          path: edura-backend-2
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Move Backend Repo to Parent Directory
        run: mv ${{ github.workspace }}/edura-backend-2 ${{ github.workspace }}/../edura-backend-2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images (Validate Compiles)
        run: |
          docker compose -f docker-compose.yml build --no-cache

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: danindu2024/edura-backend-2
          path: edura-backend-2
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          find edura-backend-2 -name "requirements.txt" -exec pip install -r {} \;
          pip install pytest pytest-cov httpx

      - name: Run Backend Tests
        env:
          REDIS_HOST: localhost
        run: |
          exit_code=0
          for service in edura-backend-2/*_service; do
            if [ -d "$service/tests" ]; then
              db_name=$(basename $service)
              echo "=================================================="
              echo "Creating database test_db_$db_name"
              echo "=================================================="
              PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -c "CREATE DATABASE test_db_$db_name;" || true
              
              echo "=================================================="
              echo "Running tests for $service"
              echo "=================================================="
              DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db_$db_name" \
              PYTHONPATH=$service \
              pytest $service --cov=$service --cov-report=xml || exit_code=1
            fi
          done
          exit $exit_code

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: danindu2024/edura-backend-2
          path: edura-backend-2
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          repository: danindu2024/edura-frontend-2
          path: edura-frontend-2
          token: ${{ secrets.GH_PAT || github.token }}

      # Python Security Scan
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run Python Dependency Audit
        run: |
          find edura-backend-2 -name "requirements.txt" -exec pip-audit -r {} --fail-on-severity high \;

      # Node Security Scan
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Node Dependency Audit
        run: |
          cd edura-frontend-2
          npm audit --audit-level=high || echo "Node dependency audit reported advisories"

  deploy-staging:
    name: Deploy - Staging
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Verify AKS Cluster Nodes
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: kubectl get nodes

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying to Staging Environment..."
          # Insert actual staging deployment script/commands here

  deploy-prod:
    name: Deploy - Production
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Environment
        run: |
          echo "Deploying to Production Environment..."
          # Insert actual production deployment script/commands here


