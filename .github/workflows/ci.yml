name: EDURA CI — 2-Week Build

on:
  push:
    branches: [ develop, main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edura-backend
          path: edura-backend
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edura-frontend
          path: edura-frontend
          token: ${{ secrets.GH_PAT || github.token }}

      # Backend Linting
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check edura-backend/

      - name: Run Black Formatter Check
        run: |
          pip install black
          black --check edura-backend/

      # Frontend Linting
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edura-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd edura-frontend
          npm ci

      - name: Run Frontend Lint
        run: |
          cd edura-frontend
          npm run lint

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edura-backend
          path: edura-backend
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images (Validate Compiles)
        run: |
          docker compose -f docker-compose.yml build --no-cache

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edura-backend
          path: edura-backend
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          # Find and install requirements across microservices to execute tests
          find edura-backend -name "requirements.txt" -exec pip install -r {} +
          pip install pytest pytest-cov httpx

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_HOST: localhost
        run: |
          pytest edura-backend/ --cov=edura-backend/ --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edura-backend
          path: edura-backend
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edura-frontend
          path: edura-frontend
          token: ${{ secrets.GH_PAT || github.token }}

      # Python Security Scan
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run Python Dependency Audit
        run: |
          find edura-backend -name "requirements.txt" -exec pip-audit -r {} --fail-on-severity high +

      # Node Security Scan
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Node Dependency Audit
        run: |
          cd edura-frontend
          npm audit --audit-level=high

  deploy-staging:
    name: Deploy - Staging
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying to Staging Environment..."
          # Insert actual staging deployment script/commands here

  deploy-prod:
    name: Deploy - Production
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Environment
        run: |
          echo "Deploying to Production Environment..."
          # Insert actual production deployment script/commands here
