name: Infrastructure CI & Deploy

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # --- JOB 1: RabbitMQ Topology & Idempotency Test ---
  rabbitmq-test:
    name: RabbitMQ Script Verification
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.12-management # Uses the image specified in your guidelines[cite: 1]
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Infra Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pika # Required by your setup.py script[cite: 4]

      - name: Run Setup Script (Initial Topology Creation)
        env:
          RABBITMQ_HOST: localhost
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        run: python rabbitmq/setup.py

      - name: Run Setup Script Again (Idempotency Check)
        env:
          RABBITMQ_HOST: localhost
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        run: python rabbitmq/setup.py

  # --- JOB 2: Full Stack Smoke Test ---
  docker-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        
      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edura-backend
          path: edura-backend
          token: ${{ secrets.GH_PAT || github.token }}

      # - name: Checkout Frontend Repo
      #   uses: actions/checkout@v4
      #   with:
      #     repository: ${{ github.repository_owner }}/edura-frontend
      #     path: edura-frontend
      #     token: ${{ secrets.GH_PAT || github.token }}

      - name: Align Repository Paths
        run: |
          # Moving repos to parent directory to match your docker-compose context
          [ -d "${{ github.workspace }}/edura-backend" ] && mv ${{ github.workspace }}/edura-backend ${{ github.workspace }}/../edura-backend || true
          [ -d "${{ github.workspace }}/edura-frontend" ] && mv ${{ github.workspace }}/edura-frontend ${{ github.workspace }}/../edura-frontend || true
          
          # Create dummy .env files for services if missing so docker compose env_file check passes
          for service_dir in ${{ github.workspace }}/../edura-backend/*_service; do
            if [ -d "$service_dir" ] && [ ! -f "$service_dir/.env" ]; then
              touch "$service_dir/.env"
            fi
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Full Environment
        run: |
          # Builds images and spins up containers in detached mode[cite: 1]
          docker compose -f docker-compose.yml up -d --build

      - name: Verify Container Health
        run: |
          echo "Waiting 15 seconds for services to initialize..."
          sleep 15
          docker compose ps
          
          # Fails the pipeline if any container crashed on startup
          if docker compose ps | grep -q "Exit"; then
            echo "One or more containers failed to stay running!"
            docker compose logs
            exit 1
          fi

  # --- JOB 3: Deploy to Staging (DDP-#18) ---
  # Every push to develop: build all images (tagged with the git SHA), push to
  # ACR, deploy to the edura-staging namespace, health-check, then smoke test.
  deploy-staging:
    name: Deploy - Staging
    needs: [rabbitmq-test, docker-smoke-test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      source_branch: develop
    secrets: inherit

  # --- JOB 4: Deploy to Production ---
  # Push to main (a release merge). The deploy job pauses until a required
  # reviewer approves it in the GitHub 'production' environment.
  # Off until the org variable ENABLE_PRODUCTION is 'true' — the minimum setup
  # (ADR-13) runs staging only.
  deploy-prod:
    name: Deploy - Production
    needs: [rabbitmq-test, docker-smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_PRODUCTION == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      source_branch: main
    secrets: inherit
