version: '3.8'

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edura
      POSTGRES_PASSWORD: edura
      POSTGRES_DB: edura
      POSTGRES_MULTIPLE_DATABASES: auth_db,user_db,course_db,content_db,enrollment_db,payment_db,assessment_db,progress_db,notification_db,analytics_db,admin_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edura"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - user_service
      - course_service
      - content_service
      - enrollment_service
      - payment_service
      - assessment_service
      - progress_service
      - notification_service
      - analytics_service
      - admin_service

  auth_service:
    build:
      context: ../edura-backend
      dockerfile: auth_service/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ../edura-backend/auth_service:/app
      - ../edura-backend/shared:/app/shared
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://edura:edura@postgres:5432/auth_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SECRET_KEY: ${SECRET_KEY:-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user_service:
    build:
      context: ../edura-backend
      dockerfile: user_service/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ../edura-backend/user_service:/app
      - ../edura-backend/shared:/app/shared
    environment:
      DATABASE_URL: ${USER_DATABASE_URL:-postgresql://edura:edura@postgres:5432/user_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SECRET_KEY: ${SECRET_KEY:-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  course_service:
